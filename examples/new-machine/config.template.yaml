# Copy this file to ~/.skills/using-memory/config.yaml on a new machine.
# Adjust only the machine-local values: path, namespace, and machine_id.

version: 1

# Optional HTTP API backend. This is command forwarding to memory-web /api/v1,
# not the Git remote URL used by `umem setup --remote`.
# remote:
#   endpoint: http://127.0.0.1:8765
#   token: change-me

memory_roots:
  - path: ~/.memories
    role: primary
    writable: true
    namespace: main
    machine_id: local-main
    priority: 100

defaults:
  read_today: true
  read_yesterday: true
  load_docs_on_demand: true

logging:
  silent_summary: false
  detail_turn_interval: 20
  hard_gate:
    memory_prompt: true
    important_interval: true

session_archive:
  enabled: false
  mode: pointer
  auto_load: false
  index_events: true

# Default lookup path:
# ~/.skills/using-memory/config.yaml
# If namespace is omitted, using-memory defaults it to main.
