version: 1

# Optional HTTP API backend. This is command forwarding to memory-web /api/v1,
# not the Git remote URL used by `umem setup --remote`.
# Only load/search/write-log/write-memory/write-preference/upsert-doc forward.
# setup/maintain/stats/status/export stay local.
# remote:
#   endpoint: http://127.0.0.1:8765
#   token: change-me

memory_roots:
  - path: ~/.memories
    role: primary
    writable: true
    namespace: main
    machine_id: local-main
    priority: 100

defaults:
  read_today: true
  read_yesterday: true
  load_docs_on_demand: true

logging:
  silent_summary: false
  detail_turn_interval: 20
  hard_gate:
    memory_prompt: true
    important_interval: true

session_archive:
  enabled: false
  mode: pointer
  auto_load: false
  index_events: true

# Pi extension settings. All optional; the defaults below apply when this block
# is absent. `detail_turn_interval` is deliberately looser than the hook hosts'
# 20 because Pi has no blocking Stop hook: the gate costs one extra model
# request, so it should fire less often. Set `gate: off` to disable it entirely.
# pi:
#   gate: message            # message | off
#   detail_turn_interval: 30
#   silent_summary: false
#   inject_preferences: true
#   brief_snapshot: true
#   memory_tool_path: ~/.skills/using-memory/scripts/memory_tool.py

# This config lives outside the memory repo and records this machine's namespace and checkout path.
# If namespace is omitted, using-memory defaults it to main.
