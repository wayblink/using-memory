[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memory-web"
version = "0.1.0"
description = "Local web browser for the using-memory skill"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "jinja2>=3.1",
    "PyYAML>=6.0",
]

[project.scripts]
memory-web = "memory_web.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
memory_web = ["templates/*.html", "static/*"]
